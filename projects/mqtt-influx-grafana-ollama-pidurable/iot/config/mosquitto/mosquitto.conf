# ==============================================================================
# Eclipse Mosquitto Configuration
# ==============================================================================

# MQTT protocol listener
listener 1883
protocol mqtt

# Allow anonymous connections (set to false for production)
allow_anonymous true

# The agent subscribes with a persistent session (QoS 1): the broker keeps its
# alerts while it restarts, and persistence keeps them across a broker restart
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
