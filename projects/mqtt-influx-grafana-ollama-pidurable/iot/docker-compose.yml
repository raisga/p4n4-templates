services:

  # ====================================================================================
  # mqtt-influx-grafana-ollama-pidurable: iot layer
  #   pumps ──MQTT──► mqtt ──► node-red ──┬──► influxdb ──► grafana
  #   (sensors/, inference/)       │      └──► alerts/<device>/anomaly ──► ../ai agent
  #                                └── anomaly_score > ANOMALY_THRESHOLD
  # ====================================================================================

  # ------------------------------------------------------------------------------------
  # MQTT Broker (Eclipse Mosquitto). Persistence keeps the agent's queued alerts
  # across a broker restart
  # ------------------------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: p4n4-mqtt
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "1883:1883"   # MQTT TCP
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Time-Series Database (InfluxDB 2)
  # ------------------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.9
    container_name: p4n4-influxdb
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-ming}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Ingest and alert rule (Node-RED): readings and inference results to InfluxDB, and
  # alerts/<device>/anomaly when anomaly_score crosses ANOMALY_THRESHOLD
  # ------------------------------------------------------------------------------------
  node-red:
    image: nodered/node-red:5.0
    container_name: p4n4-node-red
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-UTC}
      FLOWS: /data/flows/flows.json
      # Editor login (no default password: logins are refused until it is set)
      NODE_RED_USER: ${NODE_RED_USER:-admin}
      NODE_RED_PASSWORD: ${NODE_RED_PASSWORD:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
      # The alert rule, read by the flow's function node with env.get()
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-0.7}
      ALERT_HOLDOFF: ${ALERT_HOLDOFF:-60}
    volumes:
      - node-red-data:/data
      - ./config/node-red/settings.js:/data/settings.js:ro
      # Mount the directory, not the file: Node-RED saves by renaming a temp file
      # over flows.json, which fails with EBUSY on a single-file bind mount.
      # Deploying from the editor writes back into config/node-red/flows/.
      - ./config/node-red/flows:/data/flows
    depends_on:
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:1880',r=>{r.statusCode===200?process.exit(0):process.exit(1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Data Visualization (Grafana)
  # ------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: p4n4-grafana
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-adminpassword}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/investigations.json
      # Read-only access without signing in, e.g. for p4n4-dashboard's Grafana tab
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Lets p4n4-dashboard's web build show Grafana in an <iframe>
      GF_SECURITY_ALLOW_EMBEDDING: ${GRAFANA_ALLOW_EMBEDDING:-false}
      # Passed to provisioning files via env var expansion
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-p4n4-stack-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-ming}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-raw_telemetry}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Demo pumps with a scripted bearing fault (profile "demo"; enabled by
  # COMPOSE_PROFILES in .env). Publishes readings and ei-runner-shaped inference results
  # ------------------------------------------------------------------------------------
  simulator:
    image: eclipse-mosquitto:2.0.22
    container_name: p4n4-simulator
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles: [demo]
    entrypoint: ["/bin/sh", "/scripts/simulate.sh"]
    environment:
      MQTT_HOST: mqtt
      SIMULATOR_DEVICES: ${SIMULATOR_DEVICES:-pump-1 pump-2}
      SIMULATOR_INTERVAL: ${SIMULATOR_INTERVAL:-5}
      SIMULATOR_FAULT_DEVICE: ${SIMULATOR_FAULT_DEVICE:-pump-2}
      SIMULATOR_FAULT_AFTER: ${SIMULATOR_FAULT_AFTER:-90}
      SIMULATOR_FAULT_DURATION: ${SIMULATOR_FAULT_DURATION:-60}
      SIMULATOR_FAULT_EVERY: ${SIMULATOR_FAULT_EVERY:-1800}
    volumes:
      - ./scripts/simulate.sh:/scripts/simulate.sh:ro
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - p4n4-net

# ====================================================================================
# NETWORKS
# ====================================================================================
networks:
  p4n4-net:
    name: p4n4-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ====================================================================================
# VOLUMES
# ====================================================================================
volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  node-red-data:
