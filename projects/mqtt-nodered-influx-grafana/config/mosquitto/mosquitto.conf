# ==============================================================================
# Eclipse Mosquitto Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# Listeners
# ------------------------------------------------------------------------------

# auth.sh generates the private listener and device logins from MQTT_*.

# ------------------------------------------------------------------------------
# Persistence
# ------------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

include_dir /mosquitto/auth

# ------------------------------------------------------------------------------
# Bridge to an external broker
# ------------------------------------------------------------------------------

# bridge.sh generates this directory's contents from the MQTT_REMOTE_* variables
# in .env at container start (empty when MQTT_REMOTE_HOST is unset). Keep this
# last: every option after a bridge's "connection" line belongs to that bridge.
include_dir /mosquitto/bridge
