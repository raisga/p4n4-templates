# ==============================================================================
# Telegraf: MQTT → InfluxDB + file-system archive
# ==============================================================================
#
#   sensors/#        ─┐
#   alerts/+/dtc     ─┼► [raw]     mqtt_raw    ──► archive/raw/mqtt.jsonl
#   status/+/online  ─┘
#   sensors/+/+      ──► [sensors] mqtt_sensor ──► parse_sensor.star ─┐ sensor_data
#   alerts/+/dtc     ──► [dtc]     mqtt_dtc    ──► parse_dtc.star    ─┤ dtc
#   status/+/online  ──► [status]  mqtt_status ──► parse_status.star ─┤ vehicle_status
#                                                                     ├──► InfluxDB
#                                                                     └──► archive/lineprotocol/telemetry.lp
#
# The raw and parsed paths use separate subscriptions so a payload that fails
# to parse is still kept in the raw archive. sensors/<device>/raw, the obd2
# service's feature vectors (only with OBD_RAW=true in ../extras/.env), is
# dropped by both: a JSON list fits neither sensor_data nor the audit trail.
#
# ${VAR} values come from the container environment (see docker-compose.yml).
# Telegraf only substitutes them into string settings, so numeric settings
# such as rotation_max_archives are set here directly.
# ==============================================================================

[agent]
  flush_interval = "5s"
  omit_hostname = true
  # No aggregators are used; set explicitly to silence the default-change warning
  skip_processors_after_aggregators = true

# ------------------------------------------------------------------------------
# Inputs
# ------------------------------------------------------------------------------

# Every message Telegraf stores, exactly as received (an audit trail)
[[inputs.mqtt_consumer]]
  alias = "raw"
  servers = ["tcp://mqtt:1883"]
  topics = ["sensors/#", "alerts/+/dtc", "status/+/online"]
  # QoS 1 with a persistent session: the broker queues messages while Telegraf
  # is down and delivers them when it reconnects.
  qos = 1
  client_id = "p4n4-telegraf-raw"
  persistent_session = true
  topic_tag = "topic"
  name_override = "mqtt_raw"
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tagdrop]
    topic = ["sensors/*/raw"]

# Readings on sensors/<device-id>/<measurement>, parsed into sensor_data: the
# car's (sensors/car/rpm, …) and the phone's GPS fixes (sensors/car/gps)
[[inputs.mqtt_consumer]]
  alias = "sensors"
  servers = ["tcp://mqtt:1883"]
  topics = ["sensors/+/+"]
  qos = 1
  client_id = "p4n4-telegraf-sensors"
  persistent_session = true
  topic_tag = "topic"
  name_override = "mqtt_sensor"
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tagdrop]
    topic = ["sensors/*/raw"]

# Trouble codes on alerts/<device-id>/dtc, sent when they change: parsed into dtc
[[inputs.mqtt_consumer]]
  alias = "dtc"
  servers = ["tcp://mqtt:1883"]
  topics = ["alerts/+/dtc"]
  qos = 1
  client_id = "p4n4-telegraf-dtc"
  persistent_session = true
  topic_tag = "topic"
  name_override = "mqtt_dtc"
  data_format = "value"
  data_type = "string"

# The obd2 service's retained status on status/<device-id>/online: parsed into
# vehicle_status
[[inputs.mqtt_consumer]]
  alias = "status"
  servers = ["tcp://mqtt:1883"]
  topics = ["status/+/online"]
  qos = 1
  client_id = "p4n4-telegraf-status"
  persistent_session = true
  topic_tag = "topic"
  name_override = "mqtt_status"
  data_format = "value"
  data_type = "string"

# ------------------------------------------------------------------------------
# Processors
# ------------------------------------------------------------------------------

[[processors.starlark]]
  namepass = ["mqtt_sensor"]
  script = "/etc/telegraf/parse_sensor.star"

[[processors.starlark]]
  namepass = ["mqtt_dtc"]
  script = "/etc/telegraf/parse_dtc.star"

[[processors.starlark]]
  namepass = ["mqtt_status"]
  script = "/etc/telegraf/parse_status.star"

# ------------------------------------------------------------------------------
# Outputs
# ------------------------------------------------------------------------------

[[outputs.influxdb_v2]]
  namepass = ["sensor_data", "dtc", "vehicle_status"]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# The points written to InfluxDB. Re-import with:
#   influx write --bucket <bucket> --precision ns --file <file>
[[outputs.file]]
  alias = "archive-lineprotocol"
  namepass = ["sensor_data", "dtc", "vehicle_status"]
  files = ["/archive/lineprotocol/telemetry.lp"]
  rotation_interval = "${ARCHIVE_ROTATION_INTERVAL}"
  rotation_max_archives = 30
  data_format = "influx"
  influx_sort_fields = true

# One JSON object per message: {"received_at", "topic", "payload"}
[[outputs.file]]
  alias = "archive-raw"
  namepass = ["mqtt_raw"]
  files = ["/archive/raw/mqtt.jsonl"]
  rotation_interval = "${ARCHIVE_ROTATION_INTERVAL}"
  rotation_max_archives = 30
  data_format = "json"
  json_timestamp_units = "1ms"
  json_transformation = '''
    {"received_at": $fromMillis(timestamp), "topic": tags.topic, "payload": fields.value}
  '''
