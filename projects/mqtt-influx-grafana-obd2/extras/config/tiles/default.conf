# ==============================================================================
# tiles: the offline map in ./data/map, for p4n4-dashboard's Map tab
# ==============================================================================
#   /style.json                        MapLibre style; __ORIGIN__ → the URL the client used
#   /region.pmtiles                    vector tiles (PMTiles), read with HTTP range requests
#   /fonts/<fontstack>/<range>.pbf     glyphs
#   /sprites/v4/<flavor>[@2x].json|png icons
#   /healthz                           200, for the healthcheck
#
# scripts/fetch-map.sh writes them; until it has, every map URL is a 404 and
# the app falls back to an online map. Any origin may read them (CORS *): a
# web build of the dashboard runs on another origin.
# ==============================================================================

server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # A missing file is a 404, not an error worth logging (the map is optional)
    log_not_found off;

    # What fetch-map.sh writes (this replaces nginx's mime.types)
    types {
        application/json         json;
        application/x-protobuf   pbf;
        application/vnd.pmtiles  pmtiles;
        image/png                png;
        text/plain               txt;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Access-Control-Max-Age 86400 always;

    # CORS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The style points at the tiles, glyphs and sprites by URL: __ORIGIN__
    # becomes the scheme and host the client asked for, e.g.
    # http://127.0.0.1:8088, so the same files work on any address
    location = /style.json {
        sub_filter '__ORIGIN__' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types application/json;
        expires -1;
    }

    # Byte ranges of an archive whose tiles are already compressed: never gzip
    location ~ \.pmtiles$ {
        gzip off;
    }

    # Dotfiles (.gitkeep) aren't part of the map
    location ~ /\. {
        return 404;
    }
}
