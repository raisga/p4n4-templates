services:

  # ====================================================================================
  # mqtt-influx-grafana-obd2: extras layer, the car and the offline map (on the phone)
  #   ELM327 ──Bluetooth──► phone app OBD relay :35100 ──┬──► obd2 ──MQTT──► mqtt (../iot)
  #   obd2-sim (demo: a simulated car) :35000 ───────────┘
  #   ./data/map (scripts/fetch-map.sh) ──► tiles :8088 ──► p4n4-dashboard Map tab
  # Joins p4n4-net, which ../iot creates: start that layer first.
  # ====================================================================================

  # ------------------------------------------------------------------------------------
  # OBD-II (obd2): the car's readings, trouble codes and adapter status → MQTT. It reads
  # OBD_DEVICE: the simulator by default, or the phone app's Bluetooth relay. GPL-2.0
  # (python-OBD): see obd2/LICENSE
  # ------------------------------------------------------------------------------------
  obd2:
    # Built locally from obd2/service (incubating: no published image yet)
    image: p4n4-obd2:0.1.0
    build: ./obd2/service
    container_name: p4n4-obd2
    restart: ${RESTART_POLICY:-unless-stopped}
    # Non-root (USER in its Dockerfile), read-only root filesystem, no capabilities
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Read-only API: health, probe, trouble codes. Localhost only by default
      - "${OBD2_BIND:-127.0.0.1}:${OBD2_PORT:-8090}:8090"
    # The app's OBD relay listens on the phone itself, outside Docker:
    # OBD_DEVICE=socket://host.docker.internal:35100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-UTC}
      OBD_DEVICE: ${OBD_DEVICE:-socket://p4n4-obd2-sim:35000}
      OBD_DEVICE_ID: ${OBD_DEVICE_ID:-car}
      OBD_BAUDRATE: ${OBD_BAUDRATE:-}
      OBD_PROTOCOL: ${OBD_PROTOCOL:-}
      OBD_POLL_FAST_HZ: ${OBD_POLL_FAST_HZ:-5}
      OBD_POLL_SLOW_HZ: ${OBD_POLL_SLOW_HZ:-1}
      OBD_VOLTAGE_INTERVAL: ${OBD_VOLTAGE_INTERVAL:-5}
      OBD_DTC_INTERVAL: ${OBD_DTC_INTERVAL:-30}
      OBD_PIDS: ${OBD_PIDS:-}
      # sensors/<id>/raw feeds an edge model this template doesn't have
      OBD_RAW: ${OBD_RAW:-false}
      MQTT_HOST: ${MQTT_HOST:-p4n4-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      OBD2_LOG_LEVEL: ${OBD2_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Simulated car (profile "demo"; enabled by COMPOSE_PROFILES in .env): an ELM327
  # adapter on TCP 35000 (p4n4-net only), playing obd2/simulator/scenarios/<name>.yaml
  # ------------------------------------------------------------------------------------
  obd2-sim:
    image: p4n4-obd2-sim:0.1.0
    build: ./obd2/simulator
    container_name: p4n4-obd2-sim
    restart: ${RESTART_POLICY:-unless-stopped}
    profiles: [demo]
    # Don't log every request: obd2 sends about 20 a second
    command: ["--quiet"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OBD_SIM_SCENARIO: /app/scenarios/${OBD_SIM_SCENARIO:-warmup}.yaml
      OBD_SIM_DROP_EVERY: ${OBD_SIM_DROP_EVERY:-0}
    volumes:
      # Add your own scenarios here, no rebuild needed
      - ./obd2/simulator/scenarios:/app/scenarios:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 35000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - p4n4-net

  # ------------------------------------------------------------------------------------
  # Offline map (nginx): ./data/map, written by scripts/fetch-map.sh, for the app's Map
  # tab. style.json gets the address the app used in place of __ORIGIN__; region.pmtiles
  # is read with HTTP range requests. Empty: 404s, and the app uses an online map
  # ------------------------------------------------------------------------------------
  tiles:
    image: nginx:1.30.6-alpine
    container_name: p4n4-tiles
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${MAP_PORT:-8088}:8088"   # The Map tab loads http://<host>:8088/style.json
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/nginx
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./config/tiles/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/map:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - p4n4-net

# ====================================================================================
# NETWORKS
# ====================================================================================
networks:
  p4n4-net:
    external: true
    name: p4n4-net
