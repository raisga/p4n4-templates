# ==============================================================================
# Template metadata, validated against schema/template.schema.json
# ==============================================================================
schema_version: 1
name: retail-vision
version: 0.1.0
title: Retail vision · store analytics with video
description: >-
  Camera analytics for a clothing store. An edge device in the store (e.g. a
  Jetson running AIOROS Alpha Boutique) follows customers and posts events,
  alerts and heartbeats under the Jetson ↔ web contract 0.1; an ingest service
  checks them, keeps them in SQLite and copies them to InfluxDB and MQTT.
  Grafana shows traffic, shelf interest against sales, alerts A1–A4 and the
  device's health; p4n4-dashboard's Video tab plays the store camera and the
  device's tracked view through go2rtc; and a local LLM (Gemma 4 E2B on Ollama)
  answers questions in the Agent tab with the ingest service's deterministic
  numbers. A demo store and synthetic video make it work with no hardware.
layers: [iot, ai, edge]
tags: [retail, computer-vision, video, go2rtc, jetson, influxdb, grafana, mqtt, ollama, llm]
maintainers:
  - jraleman

services:
  - name: ingest
    layer: iot
    description: Device ↔ web contract 0.1 (events, alerts, reports, heartbeat, POS) and the agent API, on SQLite
    ports: [8090]
  - name: mqtt
    layer: iot
    description: Eclipse Mosquitto MQTT broker; the ingest service publishes <MQTT_TOPIC_ROOT>/<store>/…
    ports: [1883, 9001]
  - name: influxdb
    layer: iot
    description: InfluxDB 2 time-series database
    ports: [8086]
  - name: grafana
    layer: iot
    description: Provisioned InfluxDB datasource and the store dashboard
    ports: [3000]
  - name: simulator
    layer: iot
    description: Demo store posting synthetic contract traffic (compose profile "demo")
    profile: demo
  - name: agent
    layer: ai
    description: Ollama API for p4n4-dashboard's Agent tab, with tools that query the ingest service and InfluxDB
    ports: [11434]
  - name: ollama
    layer: ai
    description: Local LLM (OLLAMA_MODEL, default gemma4:e2b), reached through the agent
  - name: video
    layer: edge
    description: go2rtc serving the store camera and the device's tracked view as MJPEG for the Video tab (demo patterns without them)
    ports: [1984]
  - name: uplink
    layer: edge
    description: Forwards an edge device's SQLite to the ingest service, plus a heartbeat every 30 s (compose profile "device")
    profile: device

data:
  topics:
    - pattern: retail/<store-id>/event/<type>
      payload: contract 0.1 event JSON, as the device posted it
    - pattern: retail/<store-id>/alert/<alert-type>
      payload: contract 0.1 alert JSON
    - pattern: retail/<store-id>/heartbeat
      payload: contract 0.1 heartbeat JSON
  influxdb:
    bucket: raw_telemetry
    measurement: sensor_data
    tags: [device, sensor]
    # sensor_data holds the device's heartbeat numbers; also boutique_event,
    # boutique_alert, boutique_sale and boutique_node per store_id
  archive:
    - path: iot/data/ingest/ingest.db
      format: sqlite

smoke_test: tests/smoke.sh
